; PlatformIO Project Configuration File — fw-clock
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
lib_deps         =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.1.0
; Arduino-ESP32 2.x (platform espressif32 6.x, framework sha.dcc1105b) — LEDC API: ledcSetup / ledcAttachPin / ledcWrite
; Jangan upgrade ke 3.x tanpa menyesuaikan LedStrip.cpp (ledcAttach baru)

[env:native]
platform         = native
lib_deps         =
    bblanchon/ArduinoJson @ ^7.1.0
    throwtheswitch/Unity @ ^2.5.2
lib_ignore       = hw
build_flags      = -std=c++17
test_framework   = unity
